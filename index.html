<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oradores Congregación Norte</title>
    <!-- Poppins font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Sortable.js para animaciones fluidas de arrastre -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .sortable-ghost {
            opacity: 0.3;
            background: #334155 !important;
        }
        .sortable-drag {
            opacity: 1 !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7) !important;
            transform: scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen bg-[#0b0f19] text-slate-100 antialiased pb-28 selection:bg-indigo-500/30">
    
    <!-- Header Section -->
    <header class="text-center pt-16 pb-8 px-4 relative max-w-4xl mx-auto">
        <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight">Oradores Congregación Norte</h1>
    </header>

    <!-- Main Content Section -->
    <main class="max-w-4xl mx-auto px-4 md:px-0">
        <!-- Tarjeta de Información Superior Unificada -->
        <div class="flex flex-row items-center justify-center space-x-3 sm:space-x-8 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 sm:p-5 backdrop-blur-md shadow-lg mb-10 w-fit mx-auto whitespace-nowrap overflow-x-auto max-w-full">
            <div class="flex items-center space-x-2 sm:space-x-3 text-slate-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400 sm:w-5 sm:h-5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span class="font-medium text-xs sm:text-base">Sábado 19:00 hs</span>
            </div>
            <div class="w-px h-5 sm:h-6 bg-slate-800"></div>
            <div class="flex items-center space-x-2 sm:space-x-3 text-slate-300">
                <a href="https://www.google.com/maps/search/?api=1&query=-43.24577,-65.29282" target="_blank" class="cursor-pointer hover:scale-110 transition-transform" title="Abrir en Maps">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-400 hover:text-amber-400 transition-colors sm:w-5 sm:h-5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                </a>
                <span class="font-medium text-xs sm:text-base">Roque González 369</span>
            </div>
        </div>

        <!-- Indicador de Carga de la Nube -->
        <div id="loading-nube" class="text-center py-6 text-sm text-slate-400">
            Cargando oradores desde la nube...
        </div>

        <!-- Contenedor dinámico de tarjetas de oradores -->
        <div id="lista-oradores" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

        <!-- Controles de Edición Global -->
        <div class="mt-12 text-center">
            <button id="btn-modo-edicion" onclick="toggleModoEdicion()" class="px-6 py-2.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:border-slate-700 transition-all shadow-sm">
                Activar Edición
            </button>
        </div>
    </main>

    <!-- Barra de Acciones de Edición Flotante -->
    <div id="barra-admin" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/90 border border-slate-700/80 px-6 py-3 rounded-full shadow-2xl backdrop-blur-lg hidden items-center space-x-4 z-40">
        <button onclick="abrirModalOrador()" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-full text-sm font-semibold transition-colors shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Agregar Orador</span>
        </button>
        <button onclick="toggleModoEdicion()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-full text-sm font-medium transition-colors">
            Salir
        </button>
    </div>

    <!-- Footer Section -->
    <footer class="mt-20 text-center px-4">
        <p class="mb-4 text-slate-400 text-sm">Por favor, enviar las imágenes y el número de la canción a :</p>
        <a class="inline-flex items-center justify-center space-x-3 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 py-3 px-6 rounded-full shadow-lg hover:bg-emerald-500 hover:text-slate-900 transition-all duration-300 font-semibold group no-underline"
           href="https://wa.me/5492804977396" target="_blank">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
            <span>Marcelo Mugueta</span>
        </a>
    </footer>

    <!-- Modales -->
    <div id="modal-titulo" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 to-amber-400"></div>
            <div class="flex items-center space-x-3 mb-4 text-amber-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                <h2 class="text-xl font-bold tracking-tight" id="numero-discurso">Discurso</h2>
            </div>
            <p id="texto-discurso" class="mb-8 text-lg font-medium text-slate-200 leading-snug"></p>
            <button onclick="cerrarModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">Cerrar</button>
        </div>
    </div>

    <div id="modal-password" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-xs w-full shadow-2xl text-center">
            <h3 class="text-lg font-bold text-white mb-2">Contraseña requerida</h3>
            <p class="text-xs text-slate-400 mb-6">Ingresa la clave para modificar oradores</p>
            <input type="password" id="input-password" placeholder="Contraseña" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-white text-sm mb-4 focus:outline-none focus:border-indigo-500" onkeydown="if(event.key === 'Enter') verificarPassword()">
            <p id="error-password" class="text-rose-400 text-xs mb-4 hidden">Contraseña incorrecta</p>
            <div class="flex space-x-3">
                <button onclick="cerrarModalPassword()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-sm transition-colors">Cancelar</button>
                <button onclick="verificarPassword()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl text-sm transition-colors">Entrar</button>
            </div>
        </div>
    </div>

    <div id="modal-orador" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl max-w-md w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 id="modal-orador-titulo" class="text-xl font-bold text-white mb-6">Nuevo Orador</h2>
            <input type="hidden" id="edit-id" value="">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nombre y Apellido</label>
                    <input type="text" id="form-nombre" placeholder="Ej: Juan Pérez" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">ANC / SM</label>
                    <select id="form-tipo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                        <option value="ANC">ANC</option>
                        <option value="SM">SM</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Número de Conferencias (separadas por comas)</label>
                    <input type="text" id="form-conferencias" placeholder="Ej: 4, 32, 113" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="flex space-x-3 mt-8">
                <button onclick="cerrarModalOrador()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl text-sm transition-colors">Cancelar</button>
                <button onclick="guardarOradorFirebase()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition-colors shadow-lg">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBotZLpoIKYWUDSo9tJ4kgGBOAFQgqZNuo",
            authDomain: "oradores-e2805.firebaseapp.com",
            projectId: "oradores-e2805",
            storageBucket: "oradores-e2805.firebasestorage.app",
            messagingSenderId: "975815576838",
            appId: "1:975815576838:web:faed85980d53498b17a287"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const titulosDiscursos = {
            3: "Sirva con la organización unificada de Jehová",
            4: "El mundo que nos rodea prueba que Dios existe",
            8: "Vivamos para hacer la voluntad de Dios, no la nuestra",
            9: "Nunca se haga sordo a la Palabra de Dios",
            15: "\"Hagamos el bien a todos\"",
            32: "Cómo enfrentarse a las inquietudes de la vida",
            40: "¿Qué sucederá en el futuro cercano?",
            45: "Sigamos el camino que lleva a la vida",
            54: "Tenga fe en Dios y sus promesas",
            78: "Sirva a Jehová con alegría",
            84: "¿Escapará usted de lo que le espera a este mundo?",
            97: "Permanezcamos sin culpa en medio de una generación torcida",
            103: "Cómo ser verdaderamente felices",
            105: "Cómo obtener consuelo en toda tribulación",
            111: "La humanidad recuperará la salud por completo",
            113: "Joven, ¿cómo puedes ser feliz y tener éxito?",
            118: "Veamos a los jóvenes como los ve Jehová",
            132: "La resurrección: una victoria sobre la muerte",
            151: "Jehová es \"una altura segura\" para su pueblo",
            152: "¿Cuándo y por qué vendrá el verdadero Armagedón?",
            154: "El gobierno del hombre, pesado en la balanza",
            162: "Liberados de un mundo de oscuridad",
            163: "¿Por qué temer al Dios verdadero?",
            164: "¿Sigue Dios ejerciendo la soberanía sobre la Tierra?",
            175: "¿Qué pruebas demuestran la autenticidad de la Biblia?",
            185: "¿Gobernará alguna vez la verdad en la Tierra?",
            189: "Andar con Dios nos beneficia ahora y para siempre",
            191: "Cómo vencen al mundo la fe y el amor",
            192: "¿Anda usted por el camino que lleva a la vida eterna?"
        };

        const listaDefault = [
            { nombre: "Darío Ferrin", tipo: "ANC", conf: [32, 40, 45, 54, 84, 103, 105, 118, 151, 154, 162, 163, 192], orden: 0 },
            { nombre: "Pablo Ferrin", tipo: "ANC", conf: [191, 4], orden: 1 },
            { nombre: "Enzo Buonomo", tipo: "ANC", conf: [40, 78, 111, 175], orden: 2 },
            { nombre: "Ariel Rivas", tipo: "ANC", conf: [4, 9, 97, 164, 185], orden: 3 },
            { nombre: "Jorge Rapiman", tipo: "ANC", conf: [3, 32, 113, 132, 152], orden: 4 },
            { nombre: "Esteban García", tipo: "SM", conf: [4, 8, 113, 189], orden: 5 }
        ];

        let oradores = [];
        let modoEdicionActivo = false;
        let sortableInstance = null;

        async function cargarOradoresDesdeFirebase() {
            try {
                const querySnapshot = await getDocs(collection(db, "oradores"));
                oradores = [];
                querySnapshot.forEach((docSnap) => {
                    oradores.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (oradores.length === 0) {
                    for (const item of listaDefault) {
                        await addDoc(collection(db, "oradores"), item);
                    }
                    await cargarOradoresDesdeFirebase();
                    return;
                }

                oradores.sort((a, b) => (a.orden ?? 0) - (b.orden ?? 0));
                
                document.getElementById('loading-nube').style.display = 'none';
                renderizarOradores();
            } catch (error) {
                console.error("Error al cargar de Firebase:", error);
                document.getElementById('loading-nube').innerText = "Error al conectar con la nube.";
            }
        }

        function renderizarOradores() {
            const contenedor = document.getElementById('lista-oradores');
            contenedor.innerHTML = '';

            oradores.forEach((orador) => {
                let div = document.createElement('div');
                div.className = "bg-slate-900/60 border border-slate-800 rounded-2xl p-6 backdrop-blur-md shadow-xl transition-all duration-300 relative group";
                div.setAttribute('data-id', orador.id);

                let accionesHtml = '';
                if (modoEdicionActivo) {
                    accionesHtml = `
                        <div class="absolute top-4 right-4 flex items-center space-x-2 bg-slate-950/80 p-1.5 rounded-xl border border-slate-800 shadow-md">
                            <button onclick="abrirModalOrador('${orador.id}')" class="p-2 text-indigo-400 hover:text-white hover:bg-indigo-600/30 rounded-lg transition-colors" title="Editar">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                            </button>
                            <button onclick="eliminarOradorFirebase('${orador.id}')" class="p-2 text-rose-400 hover:text-white hover:bg-rose-600/30 rounded-lg transition-colors" title="Eliminar">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    `;
                }

                let botonesConfHtml = orador.conf.map(num => `
                    <button onclick="mostrarTitulo(${num})" class="px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-md text-sm font-medium text-slate-300 hover:bg-indigo-600 hover:text-white hover:border-indigo-500 transition-all duration-200 shadow-sm">${num}</button>
                `).join('');

                div.innerHTML = `
                    ${accionesHtml}
                    <div class="flex items-center space-x-3 mb-5 border-b border-slate-800/80 pb-4">
                        <div class="p-2 bg-slate-950 rounded-lg border border-slate-800 text-indigo-400">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </div>
                        <div class="flex items-baseline space-x-2">
                            <h2 class="text-lg font-bold text-white leading-tight">${orador.nombre}</h2>
                            <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest">${orador.tipo}</span>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${botonesConfHtml}
                    </div>
                `;
                contenedor.appendChild(div);
            });

            if (modoEdicionActivo) {
                inicializarSortable();
            }
        }

        function inicializarSortable() {
            const el = document.getElementById('lista-oradores');
            if (sortableInstance) sortableInstance.destroy();

            sortableInstance = Sortable.create(el, {
                animation: 200,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onEnd: async function (evt) {
                    const itemMoved = oradores.splice(evt.oldIndex, 1)[0];
                    oradores.splice(evt.newIndex, 0, itemMoved);

                    for (let i = 0; i < oradores.length; i++) {
                        oradores[i].orden = i;
                        const docRef = doc(db, "oradores", oradores[i].id);
                        await updateDoc(docRef, { orden: i });
                    }
                    renderizarOradores();
                }
            });
        }

        window.toggleModoEdicion = function() {
            if (!modoEdicionActivo) {
                document.getElementById('input-password').value = '';
                document.getElementById('error-password').classList.add('hidden');
                document.getElementById('modal-password').classList.remove('hidden');
                document.getElementById('modal-password').classList.add('flex');
                document.getElementById('input-password').focus();
            } else {
                modoEdicionActivo = false;
                document.getElementById('barra-admin').classList.add('hidden');
                document.getElementById('barra-admin').classList.remove('flex');
                document.getElementById('btn-modo-edicion').innerText = "Activar Edición";
                if (sortableInstance) sortableInstance.destroy();
                renderizarOradores();
            }
        };

        window.verificarPassword = function() {
            const pass = document.getElementById('input-password').value;
            if (pass === 'norte') {
                document.getElementById('modal-password').classList.add('hidden');
                document.getElementById('modal-password').classList.remove('flex');
                modoEdicionActivo = true;
                document.getElementById('barra-admin').classList.remove('hidden');
                document.getElementById('barra-admin').classList.add('flex');
                document.getElementById('btn-modo-edicion').innerText = "Desactivar Edición";
                renderizarOradores();
            } else {
                document.getElementById('error-password').classList.remove('hidden');
            }
        };

        window.cerrarModalPassword = function() {
            document.getElementById('modal-password').classList.add('hidden');
            document.getElementById('modal-password').classList.remove('flex');
        };

        window.abrirModalOrador = function(id = '') {
            document.getElementById('edit-id').value = id;
            if (id) {
                const orador = oradores.find(o => o.id === id);
                document.getElementById('modal-orador-titulo').innerText = "Editar Orador";
                document.getElementById('form-nombre').value = orador.nombre;
                document.getElementById('form-tipo').value = orador.tipo;
                document.getElementById('form-conferencias').value = orador.conf.join(', ');
            } else {
                document.getElementById('modal-orador-titulo').innerText = "Nuevo Orador";
                document.getElementById('form-nombre').value = '';
                document.getElementById('form-tipo').value = 'ANC';
                document.getElementById('form-conferencias').value = '';
            }
            document.getElementById('modal-orador').classList.remove('hidden');
            document.getElementById('modal-orador').classList.add('flex');
        };

        window.cerrarModalOrador = function() {
            document.getElementById('modal-orador').classList.add('hidden');
            document.getElementById('modal-orador').classList.remove('flex');
        };

        window.guardarOradorFirebase = async function() {
            const id = document.getElementById('edit-id').value;
            const nombre = document.getElementById('form-nombre').value.trim();
            const tipo = document.getElementById('form-tipo').value;
            const confStr = document.getElementById('form-conferencias').value.trim();

            if (!nombre) {
                alert('Por favor ingresa un nombre.');
                return;
            }

            let conf = confStr ? confStr.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n)) : [];

            if (id) {
                const docRef = doc(db, "oradores", id);
                await updateDoc(docRef, { nombre, tipo, conf });
                const index = oradores.findIndex(o => o.id === id);
                if (index > -1) {
                    oradores[index] = { ...oradores[index], nombre, tipo, conf };
                }
            } else {
                const nuevoOrden = oradores.length;
                const nuevoOrador = { nombre, tipo, conf, orden: nuevoOrden };
                const docRef = await addDoc(collection(db, "oradores"), nuevoOrador);
                oradores.push({ id: docRef.id, ...nuevoOrador });
            }

            cerrarModalOrador();
            renderizarOradores();
        };

        window.eliminarOradorFirebase = async function(id) {
            const orador = oradores.find(o => o.id === id);
            if (confirm(`¿Estás seguro de eliminar a ${orador.nombre}?`)) {
                await deleteDoc(doc(db, "oradores", id));
                oradores = oradores.filter(o => o.id !== id);
                renderizarOradores();
            }
        };

        window.mostrarTitulo = function(numero) {
            const titulo = titulosDiscursos[numero] || "Título no disponible o personalizado";
            document.getElementById('numero-discurso').innerText = "Discurso " + numero;
            document.getElementById('texto-discurso').innerText = titulo;
            
            const modal = document.getElementById('modal-titulo');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.cerrarModal = function() {
            const modal = document.getElementById('modal-titulo');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        window.onload = cargarOradoresDesdeFirebase;
    </script>
</body>
</html>
